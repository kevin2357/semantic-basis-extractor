[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrowoof-natal-authoring"
version = "0.4.43"
description = "AstroWoof semantic-basis extraction and resumable natal-deck authoring runtime"
readme = {text = "AstroWoof natal authoring runtime. See astrowoof_natal/docs for implementation documentation.", content-type = "text/plain"}
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "AstroWoof"}]
dependencies = ["semantic-projection-core==0.11.1"]

[project.scripts]
astrowoof-semantic-closure = "astrowoof_natal_authoring.cli.closure:main"
astrowoof-build-natal-basis = "astrowoof_natal_authoring.cli.extract:main"
astrowoof-release-smoke = "astrowoof_natal_authoring.smoke:main"
astrowoof-repair-polish-checkpoint = "astrowoof_natal_authoring.cli.repair:main"
astrowoof-authoring-lifecycle = "astrowoof_natal_authoring.cli.lifecycle:main"
astrowoof-lifecycle-smoke = "astrowoof_natal_authoring.lifecycle_smoke:main"
astrowoof-admit-bounded-natal = "astrowoof_natal_authoring.cli.bounded_admit:main"
astrowoof-run-bounded-natal = "astrowoof_natal_authoring.cli.bounded_run:main"
astrowoof-native-transition = "astrowoof_natal_authoring.cli.native_transition:main"
astrowoof-native-transition-availability = "astrowoof_natal_authoring.cli.native_transition_availability:main"
astrowoof-route-parity-evidence = "astrowoof_natal_authoring.route_parity:main"
astrowoof-initial-wave-contract = "astrowoof_natal_authoring.initial_wave_contract:main"
astrowoof-deployed-qa = "astrowoof_natal_authoring.cli.deployed_qa:main"
astrowoof-provider-pending-qa = "astrowoof_natal_authoring.pending_lifecycle_qa:main"
astrowoof-provider-pending-qa-v2 = "astrowoof_natal_authoring.post_fan_in_qa:main"
astrowoof-inspect-response = "astrowoof_natal_authoring.cli.inspect_response:main"
astrowoof-external-authority = "astrowoof_natal_authoring.external_authority:main"
astrowoof-external-authority-qa = "astrowoof_natal_authoring.external_authority_qa:main"
astrowoof-external-authority-v2 = "astrowoof_natal_authoring.cli.external_authority_v2:main"
astrowoof-external-authority-v2-qa = "astrowoof_natal_authoring.external_authority_v2_qa:main"
astrowoof-payload-recovery-qa = "astrowoof_natal_authoring.payload_recovery_qa:main"
astrowoof-provider-dispatch-result = "astrowoof_natal_authoring.cli.provider_dispatch_result:main"
astrowoof-operator-retirement = "astrowoof_natal_authoring.cli.operator_retirement:main"
astrowoof-operator-retirement-qa = "astrowoof_natal_authoring.operator_retirement_qa:main"
astrowoof-provider-economics-export = "astrowoof_natal_authoring.cli.provider_economics:main"
astrowoof-provider-economics-qa = "astrowoof_natal_authoring.provider_economics_qa:main"
astrowoof-adversarial-qa = "astrowoof_natal_authoring.adversarial_qa:main"
astrowoof-post-fan-in-retry-qa = "astrowoof_natal_authoring.post_fan_in_retry_qa:main"
astrowoof-ordinary-v2-happy-path-qa = "astrowoof_natal_authoring.happy_path_qa:main"
astrowoof-terminal-review-qa = "astrowoof_natal_authoring.terminal_review_qa:main"
astrowoof-retry-lineage-qa = "astrowoof_natal_authoring.retry_lineage_qa:main"
astrowoof-duplicate-submission-fence-qa = "astrowoof_natal_authoring.duplicate_submission_fence_qa:main"
astrowoof-legacy-local-work-upgrade-qa = "astrowoof_natal_authoring.legacy_local_work_upgrade_qa:main"
astrowoof-v2-intent-retirement-qa = "astrowoof_natal_authoring.intent_retirement_qa:main"
astrowoof-final-qa-mixed-custody-qa = "astrowoof_natal_authoring.final_qa_mixed_custody_qa:main"
astrowoof-trace-observability-qa = "astrowoof_natal_authoring.trace_observability_qa:main"
astrowoof-operator-disposition-assessment = "astrowoof_natal_authoring.cli.operator_disposition:main"
astrowoof-operator-disposition-qa = "astrowoof_natal_authoring.operator_disposition_qa:main"
astrowoof-run-report = "astrowoof_natal_authoring.cli.run_report:main"
astrowoof-run-report-qa = "astrowoof_natal_authoring.run_report_qa:main"
astrowoof-theme-group-policy-qa = "astrowoof_natal_authoring.theme_group_policy_qa:main"
astrowoof-finalization-boundary-qa = "astrowoof_natal_authoring.finalization_boundary_qa:main"

[tool.setuptools]
package-dir = {"" = "astrowoof_natal/src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["astrowoof_natal/src"]
include = ["astrowoof_natal_authoring*"]

[tool.setuptools.package-data]
astrowoof_natal_authoring = [
  "py.typed",
  "resources/authoring/*.md",
  "resources/contracts/*.json",
  "resources/fixtures/**/*.json",
  "resources/references/*.json",
  "resources/schemas/*.json",
]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
