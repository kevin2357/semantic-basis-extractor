[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrowoof-natal-authoring"
version = "0.3.0"
description = "AstroWoof semantic-basis extraction and resumable natal-deck authoring runtime"
readme = {text = "AstroWoof natal authoring runtime. See astrowoof_natal/docs for implementation documentation.", content-type = "text/plain"}
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "AstroWoof"}]
dependencies = []

[project.scripts]
astrowoof-semantic-closure = "astrowoof_natal_authoring.cli.closure:main"
astrowoof-build-natal-basis = "astrowoof_natal_authoring.cli.extract:main"
astrowoof-release-smoke = "astrowoof_natal_authoring.smoke:main"
astrowoof-repair-polish-checkpoint = "astrowoof_natal_authoring.cli.repair:main"
astrowoof-authoring-lifecycle = "astrowoof_natal_authoring.cli.lifecycle:main"
astrowoof-lifecycle-smoke = "astrowoof_natal_authoring.lifecycle_smoke:main"

[tool.setuptools]
package-dir = {"" = "astrowoof_natal/src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["astrowoof_natal/src"]
include = ["astrowoof_natal_authoring*"]

[tool.setuptools.package-data]
astrowoof_natal_authoring = [
  "py.typed",
  "resources/authoring/*.md",
  "resources/contracts/*.json",
  "resources/fixtures/**/*.json",
  "resources/references/*.json",
  "resources/schemas/*.json",
]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc"]
